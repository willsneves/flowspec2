name: Feature request
description: Propose a bounded addition to the format, runtime, or tooling.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or interoperability problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Explain the smallest public behavior or format change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Describe alternatives, migration needs, and effects on existing flows.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This cannot be expressed with the current stable format or an adapter.
          required: true
        - label: The proposal keeps experimental contracts isolated from flowspec/2.
          required: true
