[project]
name = "flowspec2"
version = "1.0.1"
description = "A JSON conversational-flow format that compiles to a LangGraph StateGraph at runtime."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Neves" }]
keywords = ["langgraph", "conversational-ai", "slot-filling", "whatsapp", "dsl", "state-machine"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.9,<2",
    "pydantic>=2.7,<3",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0.3,<7",
    "cryptography>=49.0.0,<51",
]

[project.urls]
Homepage = "https://github.com/willsneves/flowspec2"
Repository = "https://github.com/willsneves/flowspec2.git"
Documentation = "https://github.com/willsneves/flowspec2#readme"
Issues = "https://github.com/willsneves/flowspec2/issues"
Changelog = "https://github.com/willsneves/flowspec2/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = [
    "httpx>=0.27,<1",
]
llm = [
    "google-genai>=1.0,<3",
]
dev = [
    "google-genai>=1.0,<3",
    "httpx>=0.27,<1",
    "mypy==2.3.0",
    "pyright==1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.16.1",
    "types-jsonschema==4.26.0.20260518",
    "types-pyyaml==6.0.12.20260724",
]

[project.scripts]
flowspec2 = "flowspec2.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
build = ["hatchling==1.31.0"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/flowspec2",
    "CHANGELOG.md",
    "CITATION.cff",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "SUPPORT.md",
    "docs/VERSIONING.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec2"]

[tool.hatch.build.targets.wheel.force-include]
"src/flowspec2/flowspec-2.schema.json" = "flowspec2/flowspec-2.schema.json"
"src/flowspec2/py.typed" = "flowspec2/py.typed"
"src/flowspec2/authoring/authoring-evidence.schema.json" = "flowspec2/authoring/authoring-evidence.schema.json"
"src/flowspec2/authoring/authoring-evidence-signature.schema.json" = "flowspec2/authoring/authoring-evidence-signature.schema.json"
"src/flowspec2/authoring/authoring-operational-evidence.schema.json" = "flowspec2/authoring/authoring-operational-evidence.schema.json"
"src/flowspec2/authoring/operational-corpus.json" = "flowspec2/authoring/operational-corpus.json"
"src/flowspec2/experimental/flowspec-3-draft.schema.json" = "flowspec2/experimental/flowspec-3-draft.schema.json"
"src/flowspec2/experimental/v3-preview-loss-policy.json" = "flowspec2/experimental/v3-preview-loss-policy.json"
"src/flowspec2/compat/schemas/open-workflow-conversation-1.schema.json" = "flowspec2/compat/schemas/open-workflow-conversation-1.schema.json"
"src/flowspec2/compat/schemas/vendor/open-workflow-1.0.3.workflow.yaml" = "flowspec2/compat/schemas/vendor/open-workflow-1.0.3.workflow.yaml"
"src/flowspec2/compat/schemas/vendor/open-workflow-1.0.3.LICENSE" = "flowspec2/compat/schemas/vendor/open-workflow-1.0.3.LICENSE"
"src/flowspec2/compat/schemas/vendor/open-workflow-1.0.3.provenance.json" = "flowspec2/compat/schemas/vendor/open-workflow-1.0.3.provenance.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
files = ["src/flowspec2"]
python_version = "3.11"
strict = true

[tool.pyright]
include = ["src/flowspec2", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.uv]
package = true
