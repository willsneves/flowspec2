[project]
name = "flowspec2"
version = "0.1.0"
description = "A JSON conversational-flow format that compiles to a LangGraph StateGraph at runtime."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "wllsena" }]
keywords = ["langgraph", "conversational-ai", "slot-filling", "whatsapp", "dsl", "state-machine"]
dependencies = [
    "langgraph>=0.2.50",
    "pydantic>=2.7",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
http = [
    "httpx>=0.27",
]
llm = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "google-genai>=1.0",
]

[project.scripts]
flowspec2 = "flowspec2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec2"]

[tool.hatch.build.targets.wheel.force-include]
"src/flowspec2/flowspec-2.schema.json" = "flowspec2/flowspec-2.schema.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
